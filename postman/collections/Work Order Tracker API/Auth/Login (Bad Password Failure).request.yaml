$kind: http-request
url: "{{baseUrl}}/api/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "username": "admin",
      "password": "WrongPass"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: pm.test("login returns 401 on wrong password", () => pm.response.to.have.status(401));
    language: text/javascript
order: 2000
